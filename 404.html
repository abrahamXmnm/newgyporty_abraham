<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This page could not be found." />
    <meta name="theme-color" content="#f3efe9" />
    <title>Page Not Found — Abraham C Martin</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .not-found {
        width: min(36rem, calc(100% - 2rem));
        text-align: center;
        padding: 3rem 1.5rem;
        border: 1px solid rgba(23, 22, 18, 0.08);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.28);
      }

      .not-found h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        margin: 0 0 1rem;
        letter-spacing: -0.08em;
      }

      .not-found p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <p class="eyebrow">404</p>
      <h1>Nothing here.</h1>
      <p>The page you were looking for may have moved or no longer exists.</p>
      <a class="hero-links" href="index.html">Return home</a>
    </main>
  </body>
</html>
